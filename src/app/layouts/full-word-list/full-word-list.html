<div class="wrapper">
    @defer {
    <ul>
        @for (word of words; track word.id) {
        <li>
            <strong>{{ word.ron }}</strong> - {{ word.english }}
        </li>
        } @empty {
        <li>There are no items.</li>
        }
    </ul>
    } @loading {
        <span class="loader"></span>
    } @placeholder {
        <p>Loading full word list...</p>
    }
</div>
